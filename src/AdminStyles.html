<style>
  /* Reuses color tokens / base resets from Styles.html; adds admin-only UI. */

  #admin-app {
    max-width: 720px;
  }

  .admin-header {
    padding: 14px 4px;
    border-bottom: 1px solid var(--color-border);
    margin-bottom: 16px;
  }
  .admin-header h1 {
    font-size: 18px;
    margin: 0 0 2px;
  }
  .admin-header p {
    font-size: 13px;
    color: var(--color-text-muted);
    margin: 0;
  }

  /* ---------- Passcode gate ---------- */
  .gate-screen {
    display: flex;
    flex-direction: column;
    gap: 16px;
    justify-content: center;
    min-height: 70vh;
    padding: 0 4px;
  }
  .gate-screen h1 {
    font-size: 20px;
    text-align: center;
    margin: 0 0 6px;
  }

  /* ---------- Reviewer name bar ---------- */
  .reviewer-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .reviewer-bar label {
    font-size: 13px;
    color: var(--color-text-muted);
    white-space: nowrap;
  }
  .reviewer-bar input {
    flex: 1;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
  }

  /* ---------- Search ---------- */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .search-row input {
    flex: 1;
  }
  .refresh-btn {
    min-height: 48px;
    padding: 0 16px;
    border-radius: 12px;
    border: 2px solid var(--color-border);
    background: #fff;
    font-weight: 700;
  }

  /* ---------- Region quick-filter chips ---------- */
  .region-filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .region-chip {
    flex: 1;
    min-height: 38px;
    border-radius: 999px;
    border: 1.5px solid var(--color-border);
    background: #fff;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--color-text-muted);
  }
  .region-chip.is-active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #fff;
  }

  .patient-count {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-bottom: 10px;
  }

  /* ---------- Patient list — compact rows (not the old tall cards) ---------- */
  .patient-list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--color-border);
    border-radius: 14px;
    overflow: hidden;
  }
  .patient-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: #fff;
    border-bottom: 1px solid var(--color-border);
    cursor: pointer;
  }
  .patient-row:last-child { border-bottom: none; }
  .patient-row:active { background: var(--color-surface); }
  .patient-row__main {
    min-width: 0; /* allow text-overflow ellipsis to work in a flex child */
  }
  .patient-row__name {
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .patient-row__meta {
    font-size: 12.5px;
    color: var(--color-text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .patient-row__side {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .patient-row__chevron {
    color: var(--color-border);
    font-size: 18px;
  }

  /* Compact eligibility pill — used in both the list row and the modal header */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1.5px dashed var(--color-border);
    color: var(--color-text-muted);
    white-space: nowrap;
  }
  .pill--eligible.is-suggested { border-color: var(--color-success); color: var(--color-success); }
  .pill--not-eligible.is-suggested { border-color: var(--color-danger); color: var(--color-danger); }
  .pill--eligible.is-confirmed { border-style: solid; background: var(--color-success); border-color: var(--color-success); color: #fff; }
  .pill--not-eligible.is-confirmed { border-style: solid; background: var(--color-danger); border-color: var(--color-danger); color: #fff; }

  .empty-state {
    text-align: center;
    color: var(--color-text-muted);
    padding: 40px 10px;
    font-size: 15px;
  }

  /* ---------- Eligibility action buttons (inside the modal) ---------- */
  .eligibility-row {
    display: flex;
    gap: 10px;
  }
  .elig-btn {
    flex: 1;
    min-height: 44px;
    border-radius: 10px;
    border: 2px dashed var(--color-border);
    background: #fff;
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text-muted);
  }
  .elig-btn--eligible.is-suggested { border-color: var(--color-success); color: var(--color-success); }
  .elig-btn--not-eligible.is-suggested { border-color: var(--color-danger); color: var(--color-danger); }
  .elig-btn--eligible.is-confirmed { border-style: solid; background: var(--color-success); border-color: var(--color-success); color: #fff; }
  .elig-btn--not-eligible.is-confirmed { border-style: solid; background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .elig-hint {
    font-size: 11.5px;
    text-align: center;
    color: var(--color-text-muted);
  }

  /* ---------- Patient modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 33, 43, 0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 40;
    animation: modalFadeIn 0.15s ease;
  }
  @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (min-width: 560px) {
    .modal-backdrop { align-items: center; }
  }
  .modal-card {
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    border-radius: 18px 18px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 560px) {
    .modal-card { border-radius: 18px; max-height: 80vh; }
  }
  .modal-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-size: 18px;
    line-height: 1;
  }
  .modal-header__name {
    font-size: 19px;
    font-weight: 700;
    padding-left: 40px;
  }
  .modal-header__meta {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-top: 4px;
  }
  .modal-body {
    padding: 14px 16px 24px;
    overflow-y: auto;
  }

  /* Quick-scan two-up summary chips at the top of the modal */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .summary-chip {
    background: var(--color-surface);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .summary-chip__label {
    font-size: 11px;
    color: var(--color-text-muted);
  }
  .summary-chip__value {
    font-size: 15px;
    font-weight: 700;
    margin-top: 1px;
  }

  .detail-section-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--color-primary-dark);
    margin: 16px 0 4px;
  }

  /* One question + colored pill per line — far more compact than a
     stacked label/value block, so the whole checklist is a fast scan. */
  .qa-compact {
    display: flex;
    flex-direction: column;
  }
  .qa-compact__row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 2px;
    border-bottom: 1px solid var(--color-border);
  }
  .qa-compact__row:last-child { border-bottom: none; }
  .qa-compact__label {
    font-size: 13.5px;
    line-height: 1.3;
  }
  .qa-compact__pill {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .qa-compact__pill--yes { background: #e3f3ea; color: var(--color-success); }
  .qa-compact__pill--no { background: var(--color-surface); color: var(--color-text-muted); }

  .chip-line {
    font-size: 13.5px;
    line-height: 1.6;
  }
  .chip-line b { color: var(--color-text); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-text);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 50;
  }
  .toast.is-visible { opacity: 1; }
</style>
