<style>
  :root {
    --color-bg: #ffffff;
    --color-surface: #f6f9fb;
    --color-primary: #0a5c8a;
    --color-primary-dark: #084a6f;
    --color-primary-contrast: #ffffff;
    --color-text: #14212b;
    --color-text-muted: #52697a;
    --color-border: #d7e1e8;
    --color-success: #1c7a4d;
    --color-danger: #b3261e;
    --color-danger-bg: #fdecea;
    --radius: 16px;
    --touch-min: 56px;
    --max-width: 480px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", sans-serif;
    direction: rtl;
    text-align: right;
    font-size: 18px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: var(--max-width);
    width: 100%;
    margin: 0 auto;
    padding: 0 16px 24px;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
  }

  /* ---------- Compact header ---------- */
  .app-header {
    padding: 10px 4px 12px;
    text-align: center;
    border-bottom: 1px solid var(--color-border);
    margin-bottom: 14px;
  }
  .app-header__hospital {
    font-size: 15px;
    font-weight: 700;
    color: var(--color-primary-dark);
    margin: 0;
  }
  .app-header__campaign {
    font-size: 13px;
    color: var(--color-text-muted);
    margin: 2px 0 0;
  }
  .app-header__title {
    font-size: 16px;
    font-weight: 700;
    margin: 8px 0 0;
  }
  .app-header__disclaimer {
    font-size: 11.5px;
    color: var(--color-text-muted);
    margin: 6px 0 0;
  }

  /* ---------- Progress bar ---------- */
  .progress-wrap {
    margin: 4px 0 18px;
  }
  .progress-label {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-bottom: 6px;
    text-align: center;
  }
  .progress-track {
    background: var(--color-surface);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--color-primary);
    height: 100%;
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  /* ---------- Region screen (first screen, minimal) ---------- */
  .region-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: 16px;
    padding-top: 8vh;
  }
  .region-screen h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 8px;
  }
  .region-btn {
    background: var(--color-surface);
    border: 2px solid var(--color-border);
    border-radius: var(--radius);
    padding: 22px 16px;
    font-size: 22px;
    font-weight: 700;
    color: var(--color-text);
    min-height: 72px;
  }
  .region-btn:active,
  .region-btn.is-pressed {
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    border-color: var(--color-primary);
  }

  /* ---------- Generic step card ---------- */
  .step {
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: fadeIn 0.18s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 22px 18px;
  }

  .card__question {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.6;
  }

  .field-label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .text-input {
    width: 100%;
    font-size: 20px;
    padding: 16px 14px;
    border: 2px solid var(--color-border);
    border-radius: 12px;
    background: #fff;
    color: var(--color-text);
    min-height: var(--touch-min);
  }
  .text-input:focus {
    outline: none;
    border-color: var(--color-primary);
  }
  .field-hint {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-top: 6px;
  }
  .field-error {
    font-size: 14px;
    color: var(--color-danger);
    margin-top: 8px;
    display: none;
  }
  .field-error.is-visible { display: block; }

  /* ---------- Yes/No buttons ---------- */
  .yesno-row {
    display: flex;
    gap: 14px;
    margin-top: 14px;
  }
  .yesno-btn {
    flex: 1;
    min-height: var(--touch-min);
    border-radius: 14px;
    border: 2px solid var(--color-border);
    background: #fff;
    font-size: 19px;
    font-weight: 700;
    color: var(--color-text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .yesno-btn[aria-pressed="true"] {
    border-color: var(--color-primary);
    background: var(--color-primary);
    color: var(--color-primary-contrast);
  }
  .yesno-btn[aria-pressed="true"]::before {
    content: "✔";
  }
  .yesno-btn--no[aria-pressed="true"] {
    background: var(--color-text-muted);
    border-color: var(--color-text-muted);
  }

  /* ---------- Multi-select (chronic diseases) ---------- */
  .check-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--color-border);
    min-height: var(--touch-min);
  }
  .check-row:last-of-type { border-bottom: none; }
  .check-row input[type="checkbox"] {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    accent-color: var(--color-primary);
  }
  .check-row label {
    font-size: 17px;
    flex: 1;
  }

  /* ---------- Navigation buttons ---------- */
  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .btn {
    min-height: var(--touch-min);
    border-radius: 14px;
    border: none;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 18px;
  }
  .btn-primary {
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    flex: 1;
  }
  .btn-primary:disabled {
    opacity: 0.6;
  }
  .btn-secondary {
    background: transparent;
    color: var(--color-text-muted);
    border: 2px solid var(--color-border);
  }
  .btn-block {
    width: 100%;
  }
  .btn-submit {
    background: var(--color-primary);
    color: #fff;
    font-size: 20px;
    padding: 18px;
  }

  /* ---------- Review screen ---------- */
  .review-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .review-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--color-border);
    font-size: 16px;
  }
  .review-row:last-child { border-bottom: none; }
  .review-row__label { color: var(--color-text-muted); }
  .review-row__value { font-weight: 600; text-align: left; }

  /* ---------- Success screen ---------- */
  .success-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 12vh 8px;
  }
  .success-screen__icon {
    font-size: 64px;
    color: var(--color-success);
  }
  .success-screen__title {
    font-size: 22px;
    font-weight: 700;
  }
  .success-screen__text {
    font-size: 16px;
    color: var(--color-text-muted);
    max-width: 320px;
  }

  /* ---------- Submission-error banner ---------- */
  .error-banner {
    background: var(--color-danger-bg);
    color: var(--color-danger);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    display: none;
    gap: 10px;
    align-items: flex-start;
  }
  .error-banner.is-visible { display: flex; }

  /* ---------- Spinner ---------- */
  .spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (min-width: 540px) {
    html, body { font-size: 19px; }
  }
</style>
