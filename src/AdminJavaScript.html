<script>
(function () {
  'use strict';

  // -------------------------------------------------------------------
  // Question labels — short, admin-only wording (deliberately different
  // from the patient-facing question text) chosen so a full checklist
  // reads as a fast one-line-per-item scan. Meaning always matches the
  // ORIGINAL source criterion / the column's documented Yes/No sense —
  // no invert-mapping ambiguity for staff reviewing raw answers.
  // -------------------------------------------------------------------
  var QA_LABELS = [
    ['q1_age50_good_health', 'العمر ≥ 50 وصحة عامة جيدة'],
    ['q3_age40_family_history_early', 'العمر ≥ 40 + قريب درجة أولى (قبل 65)'],
    ['q4_family_history_breast_ovarian_pancreatic_brca', 'تاريخ عائلي ثدي/مبيض/بنكرياس أو BRCA'],
    ['q5_urinary_symptoms', 'أعراض بولية (تبول/تيار/ليلي)'],
    ['back_pain_pelvic_numbness', 'ألم ظهر/حوض أو خدران بالقدمين'],
    ['unexplained_weight_loss', 'فقدان وزن غير مبرر'],
    ['q6_no_psa_last_2_years', 'لا يوجد فحص PSA خلال سنتين'],
    ['q7_chronic_disease', 'أمراض مزمنة'],
    ['q8_no_previous_prostate_cancer', 'لا تشخيص سابق بسرطان البروستاتا'],
    ['bph_medications', 'يأخذ علاجات لتضخم البروستاتا'],
    ['q9_wants_psa', 'يرغب بإجراء PSA']
  ];

  var REGION_LABELS = { North: 'شمال', Central: 'وسط', South: 'جنوب' };

  var appEl = document.getElementById('admin-app');
  var allPatients = [];
  var reviewerName = '';
  var currentView = 'loading'; // 'loading' | 'list'
  var modalPatientId = null;
  var searchTerm = '';
  var regionFilter = 'All'; // 'All' | 'North' | 'Central' | 'South'

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.substring(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function yesNo(v) { return v === 'Yes' ? 'نعم' : v === 'No' ? 'لا' : '-'; }

  function render() {
    appEl.innerHTML = '';
    if (currentView === 'loading') return renderLoading();
    if (currentView === 'list') { renderList(); renderModalLayer(); }
  }

  // -------------------------------------------------------------------
  // LOADING — data is fetched once on page open, no passcode gate.
  // -------------------------------------------------------------------
  function renderLoading() {
    var screen = el('div', { class: 'gate-screen' }, [
      el('h1', { text: 'لوحة إدارة استمارات PSA' }),
      el('p', { class: 'field-hint', text: 'جارٍ التحميل...', style: 'text-align:center' })
    ]);
    appEl.appendChild(screen);
    fetchPatients();
  }

  // Stable patient number = row order in the Sheet (1 = first ever
  // submitted). Assigned once per fetch so it never shifts when the list
  // is searched/filtered/re-sorted for display.
  function withSeq(data) {
    return (data || []).map(function (p, i) { p._seq = i + 1; return p; });
  }

  function fetchPatients() {
    google.script.run
      .withSuccessHandler(function (data) {
        allPatients = withSeq(data);
        currentView = 'list';
        render();
      })
      .withFailureHandler(function () {
        appEl.innerHTML = '';
        appEl.appendChild(el('div', { class: 'empty-state', text: 'تعذر تحميل البيانات. أعد تحميل الصفحة.' }));
      })
      .getAdminData();
  }

  function showToast(msg) {
    var t = document.getElementById('admin-toast');
    if (!t) {
      t = el('div', { class: 'toast', id: 'admin-toast' });
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function () { t.classList.remove('is-visible'); }, 2200);
  }

  // -------------------------------------------------------------------
  // Eligibility suggestion — computed client-side purely for display; the
  // authoritative value is whatever is actually stored in Staff_Recommendation.
  // Rule (as specified): Not Eligible if age >= 75 OR a previous prostate
  // cancer diagnosis is on record; otherwise Eligible. Always overridable.
  // -------------------------------------------------------------------
  function computeSuggestion(p) {
    var age = Number(p.age);
    var hasPreviousDiagnosis = p.q8_no_previous_prostate_cancer === 'No'; // column means "no diagnosis"; 'No' => has one
    if ((isFinite(age) && age >= 75) || hasPreviousDiagnosis) return 'Not Eligible';
    return 'Eligible';
  }

  function filteredPatients() {
    var term = searchTerm.trim().toLowerCase();
    return allPatients.filter(function (p) {
      if (regionFilter !== 'All' && p.region !== regionFilter) return false;
      if (!term) return true;
      var name = String(p.full_name || '').toLowerCase();
      var nid = String(p.national_id || '').toLowerCase();
      return name.indexOf(term) !== -1 || nid.indexOf(term) !== -1;
    });
  }

  // -------------------------------------------------------------------
  // LIST VIEW — compact, single-line-per-patient rows. Tapping a row
  // opens the patient's full answers as a modal (see renderModalLayer).
  // -------------------------------------------------------------------
  function renderList() {
    var header = el('header', { class: 'admin-header' }, [
      el('h1', { text: 'استمارات PSA — المرضى' }),
      el('p', { text: 'اضغط على اسم المريض لعرض إجاباته كاملة.' })
    ]);
    appEl.appendChild(header);

    var reviewerBar = el('div', { class: 'reviewer-bar' }, [
      el('label', { for: 'reviewer-input', text: 'اسمك:' })
    ]);
    var reviewerInput = el('input', { id: 'reviewer-input', type: 'text', placeholder: '(اختياري) يُسجَّل مع كل قرار' });
    reviewerInput.value = reviewerName;
    reviewerInput.addEventListener('input', function () { reviewerName = reviewerInput.value; });
    reviewerBar.appendChild(reviewerInput);
    appEl.appendChild(reviewerBar);

    var searchRow = el('div', { class: 'search-row' });
    var searchInput = el('input', { class: 'text-input', type: 'text', placeholder: 'ابحث بالاسم أو رقم الهوية...' });
    searchInput.value = searchTerm;
    searchInput.addEventListener('input', function () { searchTerm = searchInput.value; renderList_updateOnly(); });
    var refreshBtn = el('button', { class: 'refresh-btn', type: 'button', text: '⟳ تحديث' });
    refreshBtn.addEventListener('click', function () {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '...';
      google.script.run
        .withSuccessHandler(function (data) {
          allPatients = withSeq(data);
          refreshBtn.disabled = false;
          refreshBtn.textContent = '⟳ تحديث';
          render();
        })
        .withFailureHandler(function () {
          refreshBtn.disabled = false;
          refreshBtn.textContent = '⟳ تحديث';
          showToast('تعذر التحديث.');
        })
        .getAdminData();
    });
    searchRow.appendChild(searchInput);
    searchRow.appendChild(refreshBtn);
    appEl.appendChild(searchRow);

    var filterRow = el('div', { class: 'region-filter-row' });
    [['All', 'الكل'], ['North', 'شمال'], ['Central', 'وسط'], ['South', 'جنوب']].forEach(function (pair) {
      var chip = el('button', {
        class: 'region-chip' + (regionFilter === pair[0] ? ' is-active' : ''),
        type: 'button', text: pair[1]
      });
      chip.addEventListener('click', function () { regionFilter = pair[0]; renderList_updateOnly(); updateFilterChipsActive(filterRow); });
      filterRow.appendChild(chip);
    });
    appEl.appendChild(filterRow);

    var listContainer = el('div', { id: 'patient-list-container' });
    appEl.appendChild(listContainer);
    renderPatientListInto(listContainer);
  }

  // Re-renders just the list+count (used on every keystroke in search, and on
  // region-filter changes) so the search input never loses focus from a full
  // appEl.innerHTML reset.
  function renderList_updateOnly() {
    var container = document.getElementById('patient-list-container');
    if (container) renderPatientListInto(container);
  }

  function updateFilterChipsActive(filterRow) {
    Array.from(filterRow.children).forEach(function (chip) {
      chip.classList.toggle('is-active', chip.textContent === ({ All: 'الكل', North: 'شمال', Central: 'وسط', South: 'جنوب' })[regionFilter]);
    });
  }

  function renderPatientListInto(container) {
    container.innerHTML = '';
    var items = filteredPatients();
    container.appendChild(el('div', { class: 'patient-count', text: items.length + ' من أصل ' + allPatients.length + ' مريضًا' }));

    if (items.length === 0) {
      container.appendChild(el('div', { class: 'empty-state', text: 'لا توجد نتائج.' }));
      return;
    }

    var list = el('div', { class: 'patient-list' });
    items.slice().reverse().forEach(function (p) {
      list.appendChild(buildPatientRow(p));
    });
    container.appendChild(list);
  }

  function eligibilityPill(p) {
    var suggestion = computeSuggestion(p);
    var confirmed = p.staff_recommendation; // '' | 'Eligible' | 'Not Eligible'
    var isEligibleLook = confirmed ? confirmed === 'Eligible' : suggestion === 'Eligible';
    var stateClass = confirmed ? 'is-confirmed' : 'is-suggested';
    var kindClass = isEligibleLook ? 'pill--eligible' : 'pill--not-eligible';
    var label = isEligibleLook ? 'مؤهل' : 'غير مؤهل';
    return el('span', { class: 'pill ' + kindClass + ' ' + stateClass, text: label });
  }

  function buildPatientRow(p) {
    var main = el('div', { class: 'patient-row__main' }, [
      el('div', { class: 'patient-row__name' }, [
        el('span', { class: 'patient-row__seq', text: '#' + p._seq + ' ' }),
        document.createTextNode(p.full_name || '(بدون اسم)')
      ]),
      el('div', { class: 'patient-row__meta', text: (p.age || '-') + ' سنة · ' + (REGION_LABELS[p.region] || p.region) + ' · ' + (p.national_id || '-') })
    ]);
    var side = el('div', { class: 'patient-row__side' }, [
      eligibilityPill(p),
      el('span', { class: 'patient-row__chevron', text: '‹' })
    ]);
    var row = el('div', { class: 'patient-row' }, [side, main]);
    row.addEventListener('click', function () { modalPatientId = p.submission_id; renderModalLayer(); });
    return row;
  }

  function applyEligibility(p, decision) {
    google.script.run
      .withSuccessHandler(function () {
        p.staff_recommendation = decision;
        p.staff_reviewed_by = reviewerName;
        showToast(decision === 'Eligible' ? 'تم تعيينه كمؤهل.' : 'تم تعيينه كغير مؤهل.');
        renderList_updateOnly();
        renderModalLayer();
      })
      .withFailureHandler(function () {
        showToast('تعذر حفظ القرار، حاول مرة أخرى.');
      })
      .setEligibility(p.submission_id, decision, reviewerName);
  }

  // -------------------------------------------------------------------
  // MODAL — the patient's full file. Overlays the list; the list behind
  // it keeps its scroll position since it is never torn down.
  // -------------------------------------------------------------------
  function renderModalLayer() {
    var existing = document.getElementById('patient-modal-backdrop');
    if (existing) existing.remove();
    if (!modalPatientId) return;

    var p = allPatients.filter(function (x) { return x.submission_id === modalPatientId; })[0];
    if (!p) { modalPatientId = null; return; }

    var backdrop = el('div', { class: 'modal-backdrop', id: 'patient-modal-backdrop' });
    backdrop.addEventListener('click', function (ev) { if (ev.target === backdrop) closeModal(); });

    var closeBtn = el('button', { class: 'modal-close', type: 'button', text: '×' });
    closeBtn.addEventListener('click', closeModal);

    var headerMetaParts = [(p.national_id || '-'), (p.age || '-') + ' سنة', REGION_LABELS[p.region] || p.region, p.submitted_at || ''];
    var header = el('div', { class: 'modal-header' }, [
      closeBtn,
      el('div', { class: 'modal-header__name', text: '#' + p._seq + ' — ' + (p.full_name || '(بدون اسم)') }),
      el('div', { class: 'modal-header__meta', text: headerMetaParts.join(' · ') })
    ]);

    var body = el('div', { class: 'modal-body' });

    // Eligibility action — the one thing staff is most likely to do here.
    var eligBtn = el('button', {
      class: 'elig-btn elig-btn--eligible' + (p.staff_recommendation === 'Eligible' ? ' is-confirmed' : ''),
      type: 'button', text: 'مؤهل'
    });
    var notEligBtn = el('button', {
      class: 'elig-btn elig-btn--not-eligible' + (p.staff_recommendation === 'Not Eligible' ? ' is-confirmed' : ''),
      type: 'button', text: 'غير مؤهل'
    });
    eligBtn.addEventListener('click', function () { applyEligibility(p, 'Eligible'); });
    notEligBtn.addEventListener('click', function () { applyEligibility(p, 'Not Eligible'); });
    body.appendChild(el('div', { class: 'eligibility-row' }, [eligBtn, notEligBtn]));
    body.appendChild(el('div', {
      class: 'elig-hint',
      text: p.staff_recommendation
        ? ('قرار مؤكَّد' + (p.staff_reviewed_by ? ' بواسطة ' + p.staff_reviewed_by : '') + (p.staff_reviewed_at ? ' — ' + p.staff_reviewed_at : ''))
        : ('اقتراح تلقائي: ' + (computeSuggestion(p) === 'Eligible' ? 'مؤهل' : 'غير مؤهل') + ' — اضغط للتأكيد')
    }));

    // Quick-scan summary — the handful of facts a reviewer checks first.
    var summary = el('div', { class: 'summary-grid' });
    [
      ['العنوان', p.address || '-'],
      ['الهاتف', p.phone || '-'],
      ['مدخن؟', yesNo(p.smoker)],
      ['PSA سابق؟', p.previous_psa === 'Yes' ? ('نعم' + (p.previous_psa_result ? ' (' + p.previous_psa_result + ')' : '')) : 'لا']
    ].forEach(function (pair) {
      summary.appendChild(el('div', { class: 'summary-chip' }, [
        el('div', { class: 'summary-chip__label', text: pair[0] }),
        el('div', { class: 'summary-chip__value', text: String(pair[1]) })
      ]));
    });
    body.appendChild(summary);

    // Eligibility criteria — one line per question, colored pill value.
    body.appendChild(el('div', { class: 'detail-section-title', text: 'معايير الأهلية' }));
    var qa = el('div', { class: 'qa-compact' });
    QA_LABELS.forEach(function (pair) {
      var val = p[pair[0]];
      qa.appendChild(el('div', { class: 'qa-compact__row' }, [
        el('span', { class: 'qa-compact__label', text: pair[1] }),
        el('span', { class: 'qa-compact__pill qa-compact__pill--' + (val === 'Yes' ? 'yes' : 'no'), text: yesNo(val) })
      ]));
    });
    if (p.q8_no_previous_prostate_cancer === 'No') {
      qa.appendChild(el('div', { class: 'qa-compact__row' }, [
        el('span', { class: 'qa-compact__label', text: 'يتابع حاليًا مع طبيب مختص' }),
        el('span', {
          class: 'qa-compact__pill qa-compact__pill--' + (p.previous_cancer_following_specialist === 'Yes' ? 'yes' : 'no'),
          text: yesNo(p.previous_cancer_following_specialist)
        })
      ]));
    }
    body.appendChild(qa);

    // Chronic disease — one summary line instead of a repeated Yes/No block.
    if (p.q7_chronic_disease === 'Yes') {
      var chronicList = [];
      if (p.chronic_bph === 'Yes') chronicList.push('تضخم البروستاتا');
      if (p.chronic_uti === 'Yes') chronicList.push('التهاب المسالك البولية');
      if (p.chronic_hypertension === 'Yes') chronicList.push('الضغط');
      if (p.chronic_diabetes === 'Yes') chronicList.push('السكري');
      if (p.chronic_other === 'Yes') chronicList.push(p.chronic_other_text || 'أخرى');
      body.appendChild(el('div', { class: 'detail-section-title', text: 'الأمراض المزمنة' }));
      body.appendChild(el('div', { class: 'chip-line' }, [
        document.createTextNode(chronicList.length ? chronicList.join('، ') : 'لم يُحدَّد نوعها')
      ]));
    }

    body.appendChild(el('div', { class: 'detail-section-title', text: 'رقم الاستمارة (للمرجعية)' }));
    body.appendChild(el('div', { class: 'chip-line', html: '<span style="color:var(--color-text-muted);font-size:12px">' + p.submission_id + '</span>' }));

    var card = el('div', { class: 'modal-card' }, [header, body]);
    backdrop.appendChild(card);
    document.body.appendChild(backdrop);
  }

  function closeModal() {
    modalPatientId = null;
    renderModalLayer();
  }

  render();
})();
</script>
