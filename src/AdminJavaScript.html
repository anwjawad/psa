<script>
(function () {
  'use strict';

  // -------------------------------------------------------------------
  // Question labels for the DETAIL view. Deliberately phrased to match the
  // ORIGINAL source criterion (not the patient-facing reworded question),
  // so a Yes/No here always means exactly what the column name says —
  // no invert-mapping ambiguity for staff reviewing raw answers.
  // -------------------------------------------------------------------
  var QA_LABELS = [
    ['q1_age50_good_health', 'العمر 50 سنة أو أكثر وصحة عامة جيدة'],
    ['q3_age40_family_history_early', 'العمر 40+ مع قريب درجة أولى مصاب قبل 65 سنة'],
    ['q4_family_history_breast_ovarian_pancreatic_brca', 'تاريخ عائلي لسرطان ثدي/مبيض/بنكرياس أو BRCA1/BRCA2'],
    ['q5_urinary_symptoms', 'أعراض بولية (صعوبة/كثرة تبول، ضعف تيار، استيقاظ ليلي)'],
    ['back_pain_pelvic_numbness', 'آلام أسفل الظهر/الحوض أو خدران بالقدمين'],
    ['unexplained_weight_loss', 'فقدان وزن غير مبرر مؤخرًا'],
    ['q6_no_psa_last_2_years', 'لم يقم بإجراء فحص PSA خلال آخر سنتين'],
    ['q7_chronic_disease', 'يعاني من أمراض مزمنة'],
    ['q8_no_previous_prostate_cancer', 'لا يوجد تشخيص سابق بسرطان البروستاتا'],
    ['previous_cancer_following_specialist', 'يتابع حاليًا مع طبيب مختص (إن وُجد تشخيص سابق)'],
    ['bph_medications', 'يأخذ علاجات لتضخم البروستاتا'],
    ['q9_wants_psa', 'يرغب بإجراء فحص PSA بعد فهم الفوائد والمخاطر']
  ];

  var REGION_LABELS = { North: 'شمال', Central: 'وسط', South: 'جنوب' };

  var appEl = document.getElementById('admin-app');
  var passcode = null;
  var allPatients = [];
  var reviewerName = '';
  var currentView = 'gate'; // 'gate' | 'list' | 'detail'
  var currentDetailId = null;
  var searchTerm = '';

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.substring(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function yesNo(v) { return v === 'Yes' ? 'نعم' : v === 'No' ? 'لا' : '-'; }

  function render() {
    appEl.innerHTML = '';
    if (currentView === 'gate') return renderGate();
    if (currentView === 'list') return renderList();
    if (currentView === 'detail') return renderDetail();
  }

  // -------------------------------------------------------------------
  // GATE — passcode entry. No patient data is fetched until this succeeds.
  // -------------------------------------------------------------------
  function renderGate() {
    var error = el('div', { class: 'field-error', id: 'gate-error' });
    var input = el('input', { class: 'text-input', type: 'password', placeholder: 'رمز الدخول', autocomplete: 'off' });

    var submitBtn = el('button', { class: 'btn btn-primary btn-block', type: 'button', text: 'دخول' });
    function attempt() {
      var val = input.value.trim();
      if (!val) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'جارٍ التحقق...';
      google.script.run
        .withSuccessHandler(function (data) {
          passcode = val;
          allPatients = data || [];
          currentView = 'list';
          render();
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'دخول';
          error.textContent = 'رمز الدخول غير صحيح.';
          error.classList.add('is-visible');
        })
        .getAdminData(val);
    }
    submitBtn.addEventListener('click', attempt);
    input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') attempt(); });

    var screen = el('div', { class: 'gate-screen' }, [
      el('h1', { text: 'لوحة إدارة استمارات PSA' }),
      input,
      error,
      submitBtn
    ]);
    appEl.appendChild(screen);
    setTimeout(function () { input.focus(); }, 50);
  }

  function showToast(msg) {
    var t = document.getElementById('admin-toast');
    if (!t) {
      t = el('div', { class: 'toast', id: 'admin-toast' });
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('is-visible');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function () { t.classList.remove('is-visible'); }, 2200);
  }

  // -------------------------------------------------------------------
  // Eligibility suggestion — computed client-side purely for display; the
  // authoritative value is whatever is actually stored in Staff_Recommendation.
  // Rule (as specified): Not Eligible if age >= 75 OR a previous prostate
  // cancer diagnosis is on record; otherwise Eligible. Always overridable.
  // -------------------------------------------------------------------
  function computeSuggestion(p) {
    var age = Number(p.age);
    var hasPreviousDiagnosis = p.q8_no_previous_prostate_cancer === 'No'; // column means "no diagnosis"; 'No' => has one
    if ((isFinite(age) && age >= 75) || hasPreviousDiagnosis) return 'Not Eligible';
    return 'Eligible';
  }

  function filteredPatients() {
    var term = searchTerm.trim().toLowerCase();
    if (!term) return allPatients;
    return allPatients.filter(function (p) {
      var name = String(p.full_name || '').toLowerCase();
      var nid = String(p.national_id || '').toLowerCase();
      return name.indexOf(term) !== -1 || nid.indexOf(term) !== -1;
    });
  }

  // -------------------------------------------------------------------
  // LIST VIEW
  // -------------------------------------------------------------------
  function renderList() {
    var header = el('header', { class: 'admin-header' }, [
      el('h1', { text: 'استمارات PSA — المرضى' }),
      el('p', { text: 'اضغط على اسم المريض لعرض إجاباته كاملة.' })
    ]);
    appEl.appendChild(header);

    var reviewerBar = el('div', { class: 'reviewer-bar' }, [
      el('label', { for: 'reviewer-input', text: 'اسمك:' })
    ]);
    var reviewerInput = el('input', { id: 'reviewer-input', type: 'text', placeholder: '(اختياري) يُسجَّل مع كل قرار' });
    reviewerInput.value = reviewerName;
    reviewerInput.addEventListener('input', function () { reviewerName = reviewerInput.value; });
    reviewerBar.appendChild(reviewerInput);
    appEl.appendChild(reviewerBar);

    var searchRow = el('div', { class: 'search-row' });
    var searchInput = el('input', { class: 'text-input', type: 'text', placeholder: 'ابحث بالاسم أو رقم الهوية...' });
    searchInput.value = searchTerm;
    searchInput.addEventListener('input', function () { searchTerm = searchInput.value; renderList_updateOnly(); });
    var refreshBtn = el('button', { class: 'refresh-btn', type: 'button', text: '⟳ تحديث' });
    refreshBtn.addEventListener('click', function () {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '...';
      google.script.run
        .withSuccessHandler(function (data) {
          allPatients = data || [];
          refreshBtn.disabled = false;
          refreshBtn.textContent = '⟳ تحديث';
          render();
        })
        .withFailureHandler(function () {
          refreshBtn.disabled = false;
          refreshBtn.textContent = '⟳ تحديث';
          showToast('تعذر التحديث.');
        })
        .getAdminData(passcode);
    });
    searchRow.appendChild(searchInput);
    searchRow.appendChild(refreshBtn);
    appEl.appendChild(searchRow);

    var listContainer = el('div', { id: 'patient-list-container' });
    appEl.appendChild(listContainer);
    renderPatientListInto(listContainer);
  }

  // Re-renders just the list+count (used on every keystroke in search) so the
  // search input never loses focus from a full appEl.innerHTML reset.
  function renderList_updateOnly() {
    var container = document.getElementById('patient-list-container');
    if (container) renderPatientListInto(container);
  }

  function renderPatientListInto(container) {
    container.innerHTML = '';
    var items = filteredPatients();
    container.appendChild(el('div', { class: 'patient-count', text: items.length + ' من أصل ' + allPatients.length + ' مريضًا' }));

    if (items.length === 0) {
      container.appendChild(el('div', { class: 'empty-state', text: 'لا توجد نتائج.' }));
      return;
    }

    var list = el('div', { class: 'patient-list' });
    items.slice().reverse().forEach(function (p) {
      list.appendChild(buildPatientCard(p));
    });
    container.appendChild(list);
  }

  function buildPatientCard(p) {
    var row = el('div', { class: 'patient-card__row' }, [
      el('div', {}, [
        el('div', { class: 'patient-card__name', text: p.full_name || '(بدون اسم)' }),
        el('div', { class: 'patient-card__meta', text: 'هوية: ' + (p.national_id || '-') + ' · العمر ' + p.age + ' · ' + (REGION_LABELS[p.region] || p.region) })
      ]),
      el('div', { class: 'patient-card__date', text: p.submitted_at || '' })
    ]);
    row.addEventListener('click', function () {
      currentDetailId = p.submission_id;
      currentView = 'detail';
      render();
    });

    var suggestion = computeSuggestion(p);
    var confirmed = p.staff_recommendation; // '' | 'Eligible' | 'Not Eligible'

    var eligBtn = el('button', {
      class: 'elig-btn elig-btn--eligible' + (confirmed === 'Eligible' ? ' is-confirmed' : (!confirmed && suggestion === 'Eligible' ? ' is-suggested' : '')),
      type: 'button', text: 'مؤهل'
    });
    var notEligBtn = el('button', {
      class: 'elig-btn elig-btn--not-eligible' + (confirmed === 'Not Eligible' ? ' is-confirmed' : (!confirmed && suggestion === 'Not Eligible' ? ' is-suggested' : '')),
      type: 'button', text: 'غير مؤهل'
    });
    eligBtn.addEventListener('click', function (ev) { ev.stopPropagation(); applyEligibility(p, 'Eligible'); });
    notEligBtn.addEventListener('click', function (ev) { ev.stopPropagation(); applyEligibility(p, 'Not Eligible'); });

    var eligRow = el('div', { class: 'eligibility-row' }, [eligBtn, notEligBtn]);
    var hint = el('div', {
      class: 'elig-hint',
      text: confirmed ? ('قرار مؤكَّد' + (p.staff_reviewed_by ? ' — ' + p.staff_reviewed_by : '')) : ('اقتراح تلقائي: ' + (suggestion === 'Eligible' ? 'مؤهل' : 'غير مؤهل') + ' — اضغط للتأكيد')
    });

    return el('div', { class: 'patient-card' }, [row, eligRow, hint]);
  }

  function applyEligibility(p, decision) {
    google.script.run
      .withSuccessHandler(function () {
        p.staff_recommendation = decision;
        p.staff_reviewed_by = reviewerName;
        showToast(decision === 'Eligible' ? 'تم تعيينه كمؤهل.' : 'تم تعيينه كغير مؤهل.');
        if (currentView === 'list') renderList_updateOnly();
        if (currentView === 'detail') render();
      })
      .withFailureHandler(function () {
        showToast('تعذر حفظ القرار، حاول مرة أخرى.');
      })
      .setEligibility(passcode, p.submission_id, decision, reviewerName);
  }

  // -------------------------------------------------------------------
  // DETAIL VIEW
  // -------------------------------------------------------------------
  function renderDetail() {
    var p = allPatients.filter(function (x) { return x.submission_id === currentDetailId; })[0];
    if (!p) { currentView = 'list'; return render(); }

    var backBtn = el('button', { class: 'btn btn-secondary detail-back', type: 'button', text: '← رجوع للقائمة' });
    backBtn.addEventListener('click', function () { currentView = 'list'; render(); });
    appEl.appendChild(backBtn);

    var header = el('header', { class: 'admin-header' }, [
      el('h1', { text: p.full_name || '(بدون اسم)' }),
      el('p', { text: 'رقم الهوية: ' + (p.national_id || '-') + ' · تاريخ الإرسال: ' + (p.submitted_at || '-') })
    ]);
    appEl.appendChild(header);

    var eligBtn = el('button', {
      class: 'elig-btn elig-btn--eligible' + (p.staff_recommendation === 'Eligible' ? ' is-confirmed' : ''),
      type: 'button', text: 'مؤهل'
    });
    var notEligBtn = el('button', {
      class: 'elig-btn elig-btn--not-eligible' + (p.staff_recommendation === 'Not Eligible' ? ' is-confirmed' : ''),
      type: 'button', text: 'غير مؤهل'
    });
    eligBtn.addEventListener('click', function () { applyEligibility(p, 'Eligible'); });
    notEligBtn.addEventListener('click', function () { applyEligibility(p, 'Not Eligible'); });
    appEl.appendChild(el('div', { class: 'eligibility-row' }, [eligBtn, notEligBtn]));
    appEl.appendChild(el('div', {
      class: 'elig-hint',
      text: p.staff_recommendation ? ('قرار مؤكَّد بواسطة: ' + (p.staff_reviewed_by || '-') + ' في ' + (p.staff_reviewed_at || '-'))
        : ('اقتراح تلقائي: ' + (computeSuggestion(p) === 'Eligible' ? 'مؤهل' : 'غير مؤهل'))
    }));

    appEl.appendChild(el('div', { class: 'detail-section-title', text: 'البيانات الشخصية' }));
    var demo = el('div', { class: 'detail-qa' });
    [
      ['المنطقة', REGION_LABELS[p.region] || p.region],
      ['العنوان', p.address],
      ['العمر', p.age],
      ['رقم الهاتف', p.phone],
      ['مدخن؟', yesNo(p.smoker)],
      ['فحص PSA سابق؟', yesNo(p.previous_psa)],
      ['نتيجة PSA السابقة', p.previous_psa_result || '-']
    ].forEach(function (r) { demo.appendChild(qaRow(r[0], r[1])); });
    appEl.appendChild(demo);

    appEl.appendChild(el('div', { class: 'detail-section-title', text: 'معايير الأهلية' }));
    var qa = el('div', { class: 'detail-qa' });
    QA_LABELS.forEach(function (pair) {
      qa.appendChild(qaRow(pair[1], yesNo(p[pair[0]])));
    });
    appEl.appendChild(qa);

    if (p.q7_chronic_disease === 'Yes') {
      appEl.appendChild(el('div', { class: 'detail-section-title', text: 'تفاصيل الأمراض المزمنة' }));
      var chronic = el('div', { class: 'detail-qa' });
      [
        ['تضخم البروستاتا', yesNo(p.chronic_bph)],
        ['التهاب المسالك البولية', yesNo(p.chronic_uti)],
        ['الضغط', yesNo(p.chronic_hypertension)],
        ['السكري', yesNo(p.chronic_diabetes)],
        ['أخرى', p.chronic_other === 'Yes' ? (p.chronic_other_text || 'نعم') : 'لا']
      ].forEach(function (r) { chronic.appendChild(qaRow(r[0], r[1])); });
      appEl.appendChild(chronic);
    }

    appEl.appendChild(el('div', { class: 'detail-section-title', text: 'معرّفات النظام' }));
    var sys = el('div', { class: 'detail-qa' });
    [
      ['رقم الاستمارة', p.submission_id],
      ['وقت الإرسال (خادم)', p.submitted_at]
    ].forEach(function (r) { sys.appendChild(qaRow(r[0], r[1])); });
    appEl.appendChild(sys);
  }

  function qaRow(label, value) {
    return el('div', { class: 'detail-qa__row' }, [
      el('div', { class: 'detail-qa__label', text: label }),
      el('div', { class: 'detail-qa__value', text: String(value == null || value === '' ? '-' : value) })
    ]);
  }

  render();
})();
</script>
